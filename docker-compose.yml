services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: padel-backend
    ports:
      - "4000:4000"
    volumes:
      - padel-db:/app/data
      - padel-uploads:/app/uploads
    environment:
      - PORT=4000
      - DB_DIR=/app/data
      # IMPORTANT: Defineix JWT_SECRET com a variable d'entorn real al servidor
      # Mai posis el secret real aquí si el fitxer va al repositori!
      # Opció 1: crea un fitxer .env al servidor amb JWT_SECRET=el_teu_secret
      # Opció 2: usa secrets de Docker o variables d'entorn del servidor
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3003}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: padel-frontend
    ports:
      - "3003:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  padel-db:
  padel-uploads:
