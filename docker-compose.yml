services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: padel-backend
    ports:
      - "4000:4000"
    volumes:
      # Persistir la base de datos SQLite y los uploads
      - padel-db:/app/data
      - padel-uploads:/app/uploads
    environment:
      - PORT=4000
      - DB_DIR=/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: padel-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  padel-db:
  padel-uploads:
