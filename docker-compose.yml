services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: padel-backend
    ports:
      - "4000:4000"
    volumes:
      # Persistir la base de datos SQLite y los uploads
      - padel-db:/app/data
      - padel-uploads:/app/uploads
    environment:
      - PORT=4000
      - DB_DIR=/app/data
      - JWT_SECRET=padel_secret_dev_2024
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: padel-frontend
    ports:
      - "3003:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  padel-db:
  padel-uploads:
